<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grounding</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#3E6B48">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3EFE6;--fg:#1F2A20;--mut:#7A7F6E;--card:#FBF8F1;--acc:#3E6B48;--clay:#B5643C;--line:#1F2A2014;--glow1:#DCE6D2;--glow2:#EBDDC8}
@media(prefers-color-scheme:dark){:root{--bg:#121512;--fg:#ECE8DD;--mut:#9A9C8C;--card:#1A1E1A;--acc:#8DBE8F;--clay:#E0936A;--line:#ffffff12;--glow1:#1E2B20;--glow2:#2A2219}}
*{box-sizing:border-box}
body{margin:0;color:var(--fg);font:16px/1.5 "Instrument Sans",system-ui,sans-serif;
  background:radial-gradient(600px 400px at 100% -5%,var(--glow1),transparent 65%),radial-gradient(500px 400px at -20% 105%,var(--glow2),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
main{max-width:520px;margin:auto;padding:calc(28px + env(safe-area-inset-top)) 18px calc(32px + env(safe-area-inset-bottom))}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-right:8px;box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 20%,transparent)}
h1{font:300 44px/1 "Fraunces",Georgia,serif;letter-spacing:-.02em;margin:10px 0 22px}h1 em{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;margin:14px 0;box-shadow:0 18px 40px -30px #0006}
.ring{display:flex;gap:20px;align-items:center}
.big{font:400 46px/1 "Fraunces",serif}.big small{font-size:16px;color:var(--mut);margin-left:4px}
.state{font:italic 400 19px/1.3 "Fraunces",serif;margin-top:4px}
.mut{color:var(--mut);font-size:14px}
.quote{font:300 21px/1.45 "Fraunces",serif;margin:10px 0 18px}
.tired .state{color:var(--clay)}
button,.btn{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;background:var(--fg);color:var(--bg);border:0;border-radius:999px;padding:16px;font:600 16px "Instrument Sans",system-ui;cursor:pointer;transition:transform .15s}
button:active,.btn:active{transform:scale(.98)}
button:disabled,.btn.busy{opacity:.55}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn{background:var(--acc);color:#fff}
input[type=file]{display:none}
.polaroid{background:#fff;padding:10px 10px 16px;border-radius:4px;margin:22px 4px;box-shadow:0 16px 30px -18px #0007}
.polaroid:nth-child(odd){transform:rotate(-1.2deg)}.polaroid:nth-child(even){transform:rotate(1deg)}
.polaroid img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;border-radius:2px}
.polaroid .when{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7A7F6E;margin:12px 4px 4px}
.polaroid p{font:300 15px/1.5 "Fraunces",serif;color:#1F2A20;margin:0 4px}
.empty{text-align:center;padding:30px 0 8px}.empty b{display:block;font:italic 400 22px "Fraunces",serif}
#err{color:var(--clay);font-size:14px}
</style></head><body><main>
<div class="eyebrow"><span class="dot"></span>Grounding · private</div>
<h1>Put the phone down<br><em>after this.</em></h1>
<div class="card" id="st"><div class="ring"><svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="40" fill="none" stroke="currentColor" stroke-opacity=".1" stroke-width="8"/><circle id="arc" cx="48" cy="48" r="40" fill="none" stroke="var(--acc)" stroke-width="8" stroke-linecap="round" stroke-dasharray="0 252" transform="rotate(-90 48 48)"/></svg>
<div><div class="eyebrow">On screen</div><div class="big"><span id="min">–</span><small>min</small></div><div class="state" id="th"></div></div></div></div>
<div class="card"><div class="eyebrow">Your mission</div><p id="mission" class="quote">…</p>
<button id="new" class="ghost">Give me a new mission</button></div>
<div class="card"><div class="eyebrow">Back from outside?</div><p class="mut">Snap what you found. It goes to your computer, nowhere else.</p>
<label class="btn" id="snap"><span>Take photo</span><input id="cam" type="file" accept="image/*" capture="environment"></label>
<p id="err"></p></div>
<div class="eyebrow" style="margin:28px 4px 0">Journal</div>
<div id="journal"><div class="empty"><b>Nothing here yet.</b><span class="mut">Go outside. It'll still be here.</span></div></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => (s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(path, opts) {
  const r = await fetch(path, opts), j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
async function load() {
  try {
    const s = await api("/api/status");
    $("min").textContent = s.screen_minutes;
    $("th").textContent = s.fatigued ? "Time to step away." : s.screen_minutes < 30 ? "Fresh and focused." : `${s.threshold - s.screen_minutes} min until a nudge`;
    const pct = Math.min(s.screen_minutes / s.threshold, 1);
    $("arc").setAttribute("stroke-dasharray", `${(251.3 * pct).toFixed(1)} 252`);
    $("arc").setAttribute("stroke", s.fatigued ? "var(--clay)" : "var(--acc)");
    $("st").classList.toggle("tired", s.fatigued);
    $("mission").textContent = s.mission ? s.mission.text + (s.mission.done ? "  ✓" : "") : "No mission yet.";
    const j = await api("/api/journal");
    if (j.length) $("journal").innerHTML = j.map(e => `<div class="polaroid"><img loading="lazy" src="/photos/${encodeURIComponent(e.photo)}" alt="Photo from ${esc(e.at)}">
      <div class="when">${new Date(e.at).toLocaleString([], {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"})}</div><p>${esc(e.entry)}</p></div>`).join("");
  } catch (e) { $("err").textContent = e.message; }
}
$("new").onclick = async () => {
  $("new").disabled = true; $("new").textContent = "Thinking…";
  try { await api("/api/mission", {method: "POST"}); await load(); } catch (e) { $("err").textContent = e.message; }
  $("new").disabled = false; $("new").textContent = "Give me a new mission";
};
$("cam").onchange = async () => {
  const f = $("cam").files[0]; if (!f) return;
  const fd = new FormData(); fd.append("photo", f, f.name || "photo.jpg");
  const label = $("snap").querySelector("span");
  $("snap").classList.add("busy"); label.textContent = "Writing your entry…"; $("err").textContent = "";
  try { await api("/api/reflect", {method: "POST", body: fd}); await load(); }
  catch (e) { $("err").textContent = e.message; }
  $("snap").classList.remove("busy"); label.textContent = "Take photo"; $("cam").value = "";
};
load(); setInterval(load, 60000);
</script></body></html>
